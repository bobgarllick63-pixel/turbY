function makemyblob(encodedStringAtoB, urlHash) {
	  var urlHasht = (urlHash && urlHash.length>0) ? '#'+urlHash : '';

	  var myBlob = new Blob([decodedStringAtoB], {type: 'text/html'})

  window.location.replace(url);
